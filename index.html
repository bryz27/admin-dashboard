<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">

    <title>Admin Dashboard</title>
</head>
<body>
    <div class="dashboard">
        <div class="sidebar">
            <div class="main-logo"></div>
            <div class="nav-links">
                <div class="sidelinks" id="home"></div>
                <div class="sidelinks" id="profile"></div>
                <div class="sidelinks" id="messages"></div>
                <div class="sidelinks" id="history"></div>
                <div class="sidelinks" id="tasks"></div>
                <div class="sidelinks" id="communities"></div>
            </div>
            <div class="footer-nav-links">
                <div class="sidelinks" id="settings"></div>
                <div class="sidelinks" id="support"></div>
                <div class="sidelinks" id="privacy"></div>
            </div>
        </div>
        <div class="content">
            <div class="header">
                <div id="search-bar"></div>
                <div id="profile-link"></div>
                <div id="intro"></div>
                <div id="content-inputs"></div>
            </div>
            <div class="content">
                <div id="projects">
                    <div class="project-item"></div>
                    <div class="project-item"></div>
                    <div class="project-item"></div>
                    <div class="project-item"></div>
                    <div class="project-item"></div>
                    <div class="project-item"></div>
                </div>
                <div id="announcements">
                    <div class="notif"></div>
                    <div class="notif"></div>
                    <div class="notif"></div>
                </div>
                <div id="trending">
                    <div class="trend-item"></div>
                    <div class="trend-item"></div>
                    <div class="trend-item"></div>
                    <div class="trend-item"></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
